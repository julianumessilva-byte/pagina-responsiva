<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Postagens Horizontais - Versão Ampliada</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <article class="card">
      <img class="card-image" src="https://via.placeholder.com/250" alt="Imagem do Post">
      <div class="card-content">
        <h2 class="card-title">Título da Postagem 1</h2>
        <p class="card-text">Este é um exemplo de descrição para o card flexbox exibido em linha com dimensões maiores.</p>
      </div>
      <button class="card-button">Leia mais</button>
    </article>

    <article class="card">
      <img class="card-image" src="https://via.placeholder.com/250" alt="Imagem do Post">
      <div class="card-content">
        <h2 class="card-title">Título da Postagem 2</h2>
        <p class="card-text">Outro exemplo de postagem ocupando 100% da largura horizontal disponível.</p>
      </div>
      <button class="card-button">Leia mais</button>
    </article>
  </main>

  <script src="script.js"></script>
</body>
</html>
